plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.featherkrita.feather_krita"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.featherkrita.feather_krita"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // v0.55-C fix: NO `ndk.abiFilters` here.
        //
        // Earlier revision added `abiFilters 'arm64-v8a','x86_64'` to slim the
        // fat APK, but it CONFLICTS with `flutter build apk --split-per-abi`
        // (Gradle error: "Conflicting configuration in ndk abiFilters cannot
        // be present when splits abi filters are set"). The split build sets
        // `splits.abi` with all ABIs found in jniLibs/, which Gradle refuses
        // to mix with an ndk.abiFilters block.
        //
        // Resolution: let the fat APK bundle ALL ABIs present in jniLibs/
        // (arm64-v8a + armeabi-v7a + x86_64). It's bigger (~250 MB) but
        // universal + buildable. Per-ABI split APKs (the
        // `app-<abi>-release.apk` files) are what most users download —
        // arm64-v8a split is ~80–120 MB and is what 95% of modern Android
        // devices need. See `.github/workflows/build-with-krita.yml`.
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug

            // v0.55-C: R8 / ProGuard + resource shrinking for release builds.
            //
            //   * minifyEnabled true  → R8 strips unused Java/Kotlin classes
            //     and inlines/renames what it can. Roughly -10–25% APK size
            //     depending on transitive dep surface.
            //   * shrinkResources true → aapt2 removes unreferenced resources
            //     (strings, drawables, layouts) after R8 has identified the
            //     reachable code. Requires minifyEnabled true.
            //   * proguardFiles → Flutter's default consumer-proguard-rules
            //     (auto-included by the Flutter Gradle plugin) PLUS our local
            //     rules that keep MainActivity + the Qt5 stub classes the
            //     native krita_bridge JNI_OnLoad path reflectively looks up.
            //
            // The native krita_bridge .so in jniLibs/ is untouched by R8 (R8
            // only shrinks Java/Kotlin bytecode, not ELF .so). FFI symbol
            // lookups via DynamicLibrary.open('libkrita_bridge.so') →
            // lib.lookupFunction('krita_brush_generate_dab') are unaffected.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

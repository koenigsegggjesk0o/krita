#
# GitHub Actions workflow: Build Krita brush engine dari source → .so yang jalan
#
# Cara pakai:
#   1. Push commit ini ke GitHub (sudah otomatis kalau Anda pakai repo ini)
#   2. Buka tab "Actions" di https://github.com/koenigsegggjesk0o/krita/actions
#   3. Klik workflow "Build Krita Brush Engine" → "Run workflow"
#   4. Tunggu 30-60 menit (GitHub yang build, gratis)
#   5. Setelah selesai, download artifact "krita-brush-engine-built"
#   6. Extract → dapat file .so yang BENAR-BENAR jalan
#
# Gratis untuk public repo. Untuk private repo: 2000 menit/bulan (cukup ~30 build)

name: Build Krita Brush Engine

on:
  # Trigger manual: klik "Run workflow" di tab Actions
  workflow_dispatch:

  # Auto build kalau ada perubahan di build-docker/ atau .github/
  push:
    branches: [ main ]
    paths:
      - 'build-docker/**'
      - '.github/workflows/build-brush-engine.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'build-docker/**'

# Cancel build lama kalau push baru terjadi
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build brush engine .so
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ============================================================
      # 1. CHECKOUT REPO
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL BUILD DEPENDENCIES (apt — GitHub runner punya sudo)
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            extra-cmake-modules \
            \
            # Qt 6
            qt6-base-dev qt6-tools-dev qt6-svg-dev qt6-declarative-dev \
            libqt6opengl6-dev \
            \
            # KDE Frameworks 5
            libkf5config-dev libkf5widgetsaddons-dev libkf5completion-dev \
            libkf5coreaddons-dev libkf5guiaddons-dev libkf5i18n-dev \
            libkf5itemviews-dev libkf5itemmodels-dev libkf5xmlgui-dev \
            libkf5configwidgets-dev libkf5iconthemes-dev libkf5kiocore-dev \
            libkf5service-dev libkf5windowsystem-dev libkf5notifications-dev \
            libkf5parts-dev libkf5plotting-dev libkf5kdelibs4support-dev \
            libkf5crash-dev libkf5archive-dev libkf5sonnet-dev \
            \
            # Library wajib Krita
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libeigen3-dev libexiv2-dev libfftw3-dev libgsl-dev \
            liblcms2-dev libopenexr-dev libilmbase-dev \
            libquazip5-dev libquazip1-qt5-dev \
            libgif-dev libheif-dev libjpeg-dev libpng-dev libtiff-dev \
            libraw-dev libwebp-dev \
            libpoppler-qt6-dev libpoppler-cpp-dev \
            python3 python3-pyqt5 pyqt5-dev-tools python3-sip-dev \
            libglm-dev libmypaint-dev json-c intltool

      # ============================================================
      # 3. INSTALL liblager + immer dari source
      # ============================================================
      - name: Install lager + immer
        run: |
          git clone --depth 1 https://github.com/arximboldi/immer.git /tmp/immer
          git clone --depth 1 https://github.com/arximboldi/lager.git /tmp/lager

          cd /tmp/immer
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF
          sudo cmake --build build --target install -j$(nproc)

          cd /tmp/lager
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF
          sudo cmake --build build --target install -j$(nproc)

      # ============================================================
      # 4. CLONE KRITA SOURCE (dari KDE resmi — TIDAK diubah)
      # ============================================================
      - name: Clone Krita source
        run: |
          git clone --depth 1 https://github.com/KDE/krita.git /opt/krita
          echo "Krita version:" 
          grep -E "KRITA_VERSION_STRING|GENERIC_KRITA_LIB_VERSION" /opt/krita/CMakeLists.txt | head -3

      # ============================================================
      # 5. CONFIGURE CMAKE
      # ============================================================
      - name: Configure Krita
        run: |
          cd /opt/krita
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/krita-install \
            -DBUILD_TESTING=OFF \
            -DENABLE_PYTHON=OFF \
            -DWITH_QT6=ON \
            -DQT_MAJOR_VERSION=6 \
            -DWITH_HEIF=ON -DWITH_JPEG=ON -DWITH_PNG=ON -DWITH_TIFF=ON \
            -DWITH_RAW=ON -DWITH_GIF=ON -DWITH_FFTW3=ON -DWITH_OPENEXR=ON \
            -DWITH_KDE=ON -DWITH_XCF=OFF -DWITH_SOPRANO=OFF -DWITH_HDR=OFF \
            -DWITH_WEBP=ON \
            -G Ninja

      # ============================================================
      # 6. BUILD BRUSH ENGINE TARGETS
      # ============================================================
      - name: Build brush engine libraries + plugins
        run: |
          cd /opt/krita
          # Build target spesifik brush (lebih cepat dari build full)
          cmake --build build --target \
            kritalibbrush kritaimage kritalibpaintop kritapigment kritaresources \
            krita-defaultpaintops krita-colorsmudgepaintop krita-curvepaintop \
            krita-deformpaintop krita-experimentpaintop krita-gridpaintop \
            krita-hairypaintop krita-hatchingpaintop krita-mypaintop \
            krita-particlepaintop krita-roundmarkerpaintop krita-sketchpaintop \
            krita-spraypaintop krita-tangentnormalpaintop \
            krita-brushhud krita-brushimport krita-brushexport \
            --parallel $(nproc) 2>&1 | tail -50

      # ============================================================
      # 7. COLLECT HASIL BUILD (.so) ke folder artifact
      # ============================================================
      - name: Collect built .so files
        run: |
          mkdir -p artifact/lib artifact/plugins artifact/symbols

          # Library utama
          find /opt/krita/build -name "libkritalibbrush.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritaimage.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritalibpaintop.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritapigment.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritaresources.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritaglobal.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritawidgetutils.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritaversion.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritamultiarch.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null

          # Plugin paintop (14 brush engines)
          find /opt/krita/build -path "*kritaplugins*" -name "*paintop*.so" \
            -exec cp {} artifact/plugins/ \; 2>/dev/null
          find /opt/krita/build -name "kritabrush*.so" \
            -exec cp {} artifact/plugins/ \; 2>/dev/null

          # Export symbol untuk verifikasi
          for so in artifact/lib/*.so.*; do
            [ -f "$so" ] || continue
            name=$(basename "$so" .so.*)
            nm -D --defined-only "$so" 2>/dev/null | c++filt > "artifact/symbols/${name}-symbols.txt"
          done

          # Buat manifest
          {
            echo "# Krita Brush Engine — Build Output"
            echo ""
            echo "Built on: $(date -u)"
            echo "Built by: GitHub Actions"
            echo "Source: github.com/KDE/krita (master branch)"
            echo "Build config: Qt6, Release, KF5"
            echo ""
            echo "## Library files (lib/)"
            echo ""
            ls -lh artifact/lib/ 2>/dev/null
            echo ""
            echo "## Plugin files (plugins/)"
            echo ""
            ls -lh artifact/plugins/ 2>/dev/null
            echo ""
            echo "## License"
            echo ""
            echo "All .so files are derived from GPL-2.0-or-later source code."
            echo "See LICENSES/COPYING-GPL.txt for full license text."
          } > artifact/MANIFEST.txt

          echo "=== ARTIFACT MANIFEST ==="
          cat artifact/MANIFEST.txt

      # ============================================================
      # 8. VERIFY .so bisa di-load (quick test)
      # ============================================================
      - name: Verify .so files are valid ELF
        run: |
          echo "=== Verifikasi semua .so valid ==="
          fail=0
          for so in artifact/lib/*.so.* artifact/plugins/*.so; do
            [ -f "$so" ] || continue
            if file "$so" | grep -q "ELF.*shared object"; then
              echo "  ✓ $(basename $so)"
            else
              echo "  ✗ $(basename $so) - INVALID"
              fail=1
            fi
          done
          exit $fail

      # ============================================================
      # 9. UPLOAD ARTIFACT (bisa di-download dari GitHub)
      # ============================================================
      - name: Upload built brush engine
        uses: actions/upload-artifact@v4
        with:
          name: krita-brush-engine-built
          path: artifact/
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 10. SUMMARY di GitHub Actions log
      # ============================================================
      - name: Build summary
        run: |
          echo "## 🎉 Build selesai!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "File \`.so\` yang dihasilkan:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Ukuran |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          for so in artifact/lib/*.so.* artifact/plugins/*.so; do
            [ -f "$so" ] || continue
            sz=$(du -h "$so" | cut -f1)
            echo "| \`$(basename $so)\` | $sz |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifact **krita-brush-engine-built** dari sidebar kanan." >> $GITHUB_STEP_SUMMARY
          echo "Extract → dapat file .so yang BENAR-BENAR bisa dijalankan." >> $GITHUB_STEP_SUMMARY

name: Build Feather-Krita with Krita Engine

on:
  workflow_dispatch:
  push:
    branches: [ feather-krita-flutter ]

jobs:
  build-windows-with-krita:
    name: Build Windows EXE with Krita Brush Engine
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Download Krita portable ZIP (contains all .dll)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.kde.org/stable/krita/6.0.3/krita-x64-6.0.3.zip" -OutFile krita-portable.zip
          Expand-Archive -Path krita-portable.zip -DestinationPath krita-files -Force
          Write-Host "Krita files extracted"

      - name: Copy Krita DLLs to Flutter project
        shell: pwsh
        run: |
          $kritaBin = "krita-files\krita-x64-6.0.3\bin"
          $destDir = "windows\flutter\external"
          New-Item -ItemType Directory -Force -Path $destDir
          
          # Copy all Krita libraries
          Copy-Item "$kritaBin\libkrita*.dll" -Destination $destDir -Force
          Copy-Item "$kritaBin\krita*.dll" -Destination $destDir -Force -Force
          Copy-Item "$kritaBin\Qt6*.dll" -Destination $destDir -Force -ErrorAction SilentlyContinue
          Copy-Item "$kritaBin\lib*.dll" -Destination $destDir -Force -ErrorAction SilentlyContinue
          
          Write-Host "Copied Krita DLLs:"
          Get-ChildItem $destDir -Filter "*.dll" | Format-Table Name, Length

      - name: Build Flutter Windows
        shell: pwsh
        run: |
          flutter build windows --release 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed, trying debug build..."
            flutter build windows --debug 2>&1
          }

      - name: Copy Krita DLLs to build output
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "build\windows\x64\runner\Debug"
          }
          $kritaBin = "krita-files\krita-x64-6.0.3\bin"
          
          # Copy ALL Krita DLLs to build output
          Get-ChildItem "$kritaBin\*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $buildDir -Force -ErrorAction SilentlyContinue
          }
          
          # Copy kritaplugins folder
          $pluginsDir = Join-Path $buildDir "kritaplugins"
          New-Item -ItemType Directory -Force -Path $pluginsDir
          Get-ChildItem "$kritaBin\kritaplugins\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination $pluginsDir -Force -ErrorAction SilentlyContinue
          }
          
          # Copy data folder (brushes, presets, etc)
          $dataDir = Join-Path $buildDir "data"
          New-Item -ItemType Directory -Force -Path $dataDir
          Copy-Item "krita-files\krita-x64-6.0.3\share\krita" -Destination $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          
          Write-Host "Build output contents:"
          Get-ChildItem $buildDir | Format-Table Name, Length

      - name: Package as ZIP
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "build\windows\x64\runner\Debug"
          }
          Compress-Archive -Path "$buildDir\*" -DestinationPath feather-krita-krita-engine.zip -Force
          Write-Host "ZIP created"
          Get-Item feather-krita-krita-engine.zip | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-windows-with-krita-engine
          path: feather-krita-krita-engine.zip
          retention-days: 90

  build-android-with-krita:
    name: Build Android APK with Krita Brush Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-with-krita-engine
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90

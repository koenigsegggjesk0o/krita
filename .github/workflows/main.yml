name: Build Krita Brush Engine
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'build-docker/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config extra-cmake-modules \
            qt6-base-dev qt6-tools-dev qt6-svg-dev libqt6opengl6-dev \
            qt6-base-private-dev \
            qtbase5-dev qtbase5-private-dev qttools5-dev qttools5-dev-tools \
            libkf5config-dev libkf5widgetsaddons-dev libkf5completion-dev \
            libkf5coreaddons-dev libkf5guiaddons-dev libkf5i18n-dev \
            libkf5itemviews-dev libkf5itemmodels-dev libkf5xmlgui-dev \
            libkf5configwidgets-dev libkf5iconthemes-dev \
            libkf5service-dev libkf5windowsystem-dev libkf5notifications-dev \
            libkf5parts-dev libkf5plotting-dev libkf5kdelibs4support-dev \
            libkf5crash-dev libkf5archive-dev libkf5sonnet-dev \
            libkf5kio-dev \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libeigen3-dev libexiv2-dev libfftw3-dev libgsl-dev \
            liblcms2-dev libopenexr-dev libilmbase-dev \
            libquazip5-dev libquazip1-qt5-dev \
            libgif-dev libheif-dev libjpeg-dev libpng-dev libtiff-dev \
            libraw-dev libwebp-dev libpoppler-qt6-dev libpoppler-cpp-dev \
            python3 python3-pyqt5 pyqt5-dev-tools python3-sip-dev \
            libglm-dev libmypaint-dev libjson-c-dev intltool \
            libxi-dev libxt-dev libxext-dev libx11-dev \
            libfreetype-dev libfontconfig1-dev libharfbuzz-dev \
            libopengl-dev libegl-dev \
            libopenjp2-7-dev libturbojpeg0-dev \
            libunibreak-dev libraqm-dev \
            qtdeclarative5-dev libqt5quickcontrols2-5 \
            qtquickcontrols2-5-dev qml-module-qtquick-controls2 \
            qml-module-qtquick2 qml-module-qtquick-layouts
          # Krita v5.3.3 butuh Qt5 - JANGAN hapus Qt5
          # Kita biarkan Krita pakai Qt5 (default untuk v5.3.3 stable)

      - name: Install Catch2 + Zug + immer + lager (dependency chain)
        run: |
          # Catch2 (immer butuh untuk configure)
          git clone --depth 1 --branch v3.5.2 https://github.com/catchorg/Catch2.git /tmp/catch2
          cd /tmp/catch2 && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF && sudo cmake --build build --target install -j$(nproc)
          # Zug (lager butuh)
          git clone --depth 1 https://github.com/arximboldi/zug.git /tmp/zug
          cd /tmp/zug && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF && sudo cmake --build build --target install -j$(nproc)
          # immer
          git clone --depth 1 https://github.com/arximboldi/immer.git /tmp/immer
          cd /tmp/immer && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF -DBUILD_BENCHMARKS=OFF && sudo cmake --build build --target install -j$(nproc)
          # lager (pakai nama flag yang benar: lager_BUILD_*, install sass untuk debugger resources)
          git clone --depth 1 https://github.com/arximboldi/lager.git /tmp/lager
          cd /tmp/lager && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr \
            -Dlager_BUILD_TESTS=OFF -Dlager_BUILD_FAILURE_TESTS=OFF \
            -Dlager_BUILD_EXAMPLES=OFF -Dlager_BUILD_DEBUGGER_EXAMPLES=OFF \
            -Dlager_BUILD_DOCS=OFF -Dlager_EMBED_RESOURCES_PATH=OFF \
            && sudo cmake --build build --target install -j$(nproc)
          # xsimd (REQUIRED by Krita, tidak ada di apt — build dari source)
          git clone --depth 1 --branch 13.0.0 https://github.com/xtensor-stack/xsimd.git /tmp/xsimd
          cd /tmp/xsimd && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF && sudo cmake --build build --target install -j$(nproc)

      - name: Clone Krita v5.3.3 (TERBUKTI work di Run #26) + verifikasi krita-source/ lokal sama
        run: |
          # Clone Krita v5.3.3 dari KDE (versi stabil yang sudah terbukti build sukses di Run #26)
          git clone --depth 1 --branch krita/5.2.2.x https://github.com/KDE/krita.git /opt/krita 2>/dev/null || \
          git clone --depth 1 https://github.com/KDE/krita.git /opt/krita
          cd /opt/krita
          echo "=== Krita source dari KDE ==="
          echo "Total file C++: $(find . -name '*.h' -o -name '*.cpp' -o -name '*.cc' | wc -l)"
          head -5 libs/brush/kis_brush.h
          echo ""
          echo "=== Verifikasi krita-source/ di repo ini sama dengan KDE ==="
          echo "krita-source/ file count: $(find /home/runner/work/krita/krita/krita-source -name '*.h' -o -name '*.cpp' -o -name '*.cc' 2>/dev/null | wc -l)"
          head -5 /home/runner/work/krita/krita/krita-source/libs/brush/kis_brush.h 2>/dev/null || echo "(krita-source/ tidak ditemukan di checkout)"

      - name: Configure
        run: |
          cd /opt/krita
          # Qt5 + KF5 (terbukti work di Run #26)
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/krita-install \
            -DBUILD_TESTING=OFF -DENABLE_PYTHON=OFF \
            -DWITH_QT6=OFF -DQT_MAJOR_VERSION=5 \
            -DWITH_HEIF=OFF -DWITH_JPEG=ON -DWITH_PNG=ON -DWITH_TIFF=ON \
            -DWITH_RAW=OFF -DWITH_GIF=OFF -DWITH_FFTW3=OFF -DWITH_OPENEXR=OFF \
            -DWITH_KDE=ON -DWITH_XCF=OFF -DWITH_SOPRANO=OFF -DWITH_HDR=OFF \
            -DWITH_WEBP=OFF -DWITH_JXL=OFF -DWITH_OCIO=OFF \
            -DWITH_OPENJPEG=OFF -DWITH_MEDIA=OFF \
            -G Ninja 2>&1 | tail -100

      - name: Build brush engine
        run: |
          cd /opt/krita
          set -o pipefail
          cmake --build build --target \
            kritalibbrush kritaimage kritalibpaintop kritapigment kritaresources \
            kritadefaultpaintops kritacolorsmudgepaintop kritacurvepaintop \
            kritadeformpaintop kritaexperimentpaintop kritagridpaintop \
            kritahairypaintop kritahatchingpaintop kritamypaintop \
            kritaparticlepaintop kritaroundmarkerpaintop kritasketchpaintop \
            kritaspraypaintop kritatangentnormalpaintop \
            \
            --parallel $(nproc) 2>&1 | tail -80

      - name: Collect .so
        if: always()
        run: |
          mkdir -p artifact/lib artifact/plugins artifact/symbols
          find /opt/krita/build -name "libkritalibbrush.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritaimage.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritalibpaintop.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritapigment.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritaresources.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritaglobal.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritawidgetutils.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritaversion.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -name "libkritamultiarch.so*" -exec cp -P {} artifact/lib/ \; 2>/dev/null
          find /opt/krita/build -path "*kritaplugins*" -name "*paintop*.so" -exec cp {} artifact/plugins/ \; 2>/dev/null
          find /opt/krita/build -name "kritabrush*.so" -exec cp {} artifact/plugins/ \; 2>/dev/null
          {
            echo "# Krita Brush Engine - Build Output"
            echo "Built: $(date -u)"
            echo "Source: github.com/KDE/krita (master)"
            echo "License: GPL-2.0-or-later"
            echo ""
            echo "## Library files (lib/)"
            ls -lh artifact/lib/ 2>/dev/null
            echo ""
            echo "## Plugin files (plugins/)"
            ls -lh artifact/plugins/ 2>/dev/null
          } > artifact/MANIFEST.txt
          cat artifact/MANIFEST.txt

      - name: Verify .so valid
        run: |
          for so in artifact/lib/*.so.* artifact/plugins/*.so; do
            [ -f "$so" ] || continue
            file "$so" | grep -q "ELF.*shared object" && echo "OK: $(basename $so)" || (echo "BAD: $so"; exit 1)
          done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krita-brush-engine-built
          path: artifact/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          if [ -f artifact/MANIFEST.txt ]; then
            cat artifact/MANIFEST.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Build failed - check logs above" >> $GITHUB_STEP_SUMMARY
          fi

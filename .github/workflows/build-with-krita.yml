name: Build Feather-Krita with Krita Engine

on:
  workflow_dispatch:
  push:
    branches: [ feather-krita-flutter ]

jobs:
  compile-krita-bridge:
    name: Compile krita_bridge.dll
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt6 via aqtinstall
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 --outputdir C:\Qt

      - name: Build zlib from source
        shell: pwsh
        run: |
          # Clone zlib source and compile with MSVC
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git C:\zlib-src
          cd C:\zlib-src
          cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:\zlib-install
          cmake --build build --target install
          cd ..
          # Verify
          $zlibLib = (Get-ChildItem "C:\zlib-install\lib\*.lib" | Select-Object -First 1).FullName
          $zlibInc = "C:\zlib-install\include"
          Write-Host "zlib lib: $zlibLib"
          Write-Host "zlib include: $zlibInc"
          echo "ZLIB_LIB=$zlibLib" >> $env:GITHUB_ENV
          echo "ZLIB_INC=$zlibInc" >> $env:GITHUB_ENV

      - name: Compile krita_bridge.dll
        shell: pwsh
        run: |
          $qtDir = "C:\Qt\6.6.3\msvc2019_64"
          $zlibLib = $env:ZLIB_LIB
          $zlibInc = $env:ZLIB_INC
          
          Write-Host "zlib lib: $zlibLib"
          Write-Host "zlib include: $zlibInc"
          
          $incPaths = @(
            "native\krita_bridge",
            "$qtDir\include",
            "$qtDir\include\QtCore",
            "$qtDir\include\QtGui",
            "$qtDir\include\QtWidgets",
            "$qtDir\include\QtXml"
          )
          if ($zlibInc) { $incPaths += $zlibInc }
          $incArgs = ($incPaths | ForEach-Object { "-I`"$_`"" }) -join " "
          
          $libs = @(
            "$qtDir\lib\Qt6Core.lib",
            "$qtDir\lib\Qt6Gui.lib",
            "$qtDir\lib\Qt6Widgets.lib",
            "$qtDir\lib\Qt6Xml.lib"
          )
          if ($zlibLib) { $libs += $zlibLib }
          $libArgs = ($libs | ForEach-Object { "`"$_`"" }) -join " "
          
          $defines = "/DQT_CORE_LIB /DQT_GUI_LIB /DQT_XML_LIB /DQT_NO_DEBUG /DNDEBUG /D_USE_MATH_DEFINES"
          
          $cmd = "cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /Zc:preprocessor /EHsc /MD /O2 /LD $incArgs $defines native\krita_bridge\krita_bridge.cpp /Fe:krita_bridge.dll /link $libArgs /SUBSYSTEM:CONSOLE /MACHINE:X64"
          Write-Host "Command: $cmd"
          $cmd | Out-File -FilePath compile.bat -Encoding ASCII -Force
          cmd /c compile.bat 2>&1
          
          if (Test-Path krita_bridge.dll) {
            Write-Host "SUCCESS: krita_bridge.dll compiled"
            Get-Item krita_bridge.dll | Format-Table Name, Length
          } else {
            Write-Host "FAILED"
            exit 1
          }

      - name: Upload krita_bridge.dll
        uses: actions/upload-artifact@v4
        with:
          name: krita-bridge-dll
          path: krita_bridge.dll
          retention-days: 90

  build-windows-with-krita:
    name: Build Windows EXE with Krita Engine
    runs-on: windows-latest
    needs: compile-krita-bridge
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Download krita_bridge.dll
        uses: actions/download-artifact@v4
        with:
          name: krita-bridge-dll
          path: .

      - name: Download Krita portable ZIP
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.kde.org/stable/krita/6.0.3/krita-x64-6.0.3.zip" -OutFile krita-portable.zip
          Expand-Archive -Path krita-portable.zip -DestinationPath krita-files -Force

      - name: Build Flutter Windows
        run: flutter build windows --release

      - name: Copy Krita DLLs + bridge + data to build output
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $kritaRoot = (Get-ChildItem "krita-files" -Directory | Select-Object -First 1).FullName
          $kritaBin = Join-Path $kritaRoot "bin"
          $kritaShare = Join-Path $kritaRoot "share\krita"

          # Copy ALL Krita DLLs
          Get-ChildItem "$kritaBin\*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $buildDir -Force
          }

          # Copy kritaplugins
          $pluginsSrc = Join-Path $kritaBin "kritaplugins"
          if (Test-Path $pluginsSrc) {
            Copy-Item $pluginsSrc -Destination $buildDir -Recurse -Force
          }

          # Copy Krita data (brushes, presets, etc)
          if (Test-Path $kritaShare) {
            $dataDst = Join-Path $buildDir "data\krita"
            New-Item -ItemType Directory -Force -Path $dataDst
            Copy-Item $kritaShare -Destination $dataDst -Recurse -Force
          }

          # Copy krita_bridge.dll (the compiled C ABI wrapper)
          if (Test-Path "krita_bridge.dll") {
            Copy-Item "krita_bridge.dll" -Destination $buildDir -Force
            Write-Host "Copied krita_bridge.dll"
          }

          # Copy krita-data.zip (727 brush presets)
          if (Test-Path "assets\krita-data.zip") {
            Copy-Item "assets\krita-data.zip" -Destination $buildDir -Force
            Write-Host "Copied krita-data.zip"
          }

          # Total size
          $totalSize = (Get-ChildItem $buildDir -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "=== Total build size: $([math]::Round($totalSize / 1MB, 1)) MB ==="

      # NOTE (v0.57-fix): upload the Release/ DIRECTORY directly, not a
      # pre-zipped file. `actions/upload-artifact@v4` already wraps the
      # upload in its own zip — uploading a .zip would create a NESTED
      # zip (user downloads X.zip → extracts → gets another Y.zip → extracts
      # again → finally gets the .exe). Uploading the folder means the user
      # downloads ONE zip, extracts ONCE, and gets feather_krita.exe +
      # krita_bridge.dll + all the Krita data files ready to run.
      - name: Upload Windows build (folder, no nested zip)
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-windows-with-krita-engine
          path: build/windows/x64/runner/Release/*
          retention-days: 90

  build-android-with-krita:
    name: Build Android APK with Krita Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # v0.55-C: Android APK size optimization.
      #
      # Build BOTH a fat (universal) APK and per-ABI split APKs so users can
      # pick the smallest artifact for their device:
      #
      #   * Fat APK (~190–257 MB pre-v0.55, ~110–160 MB post-v0.55 with R8 +
      #     resource shrinking + abiFilters=arm64-v8a,x86_64) — universal,
      #     works on any device the abiFilters allow.
      #   * Per-ABI APKs (~60–120 MB each) — one per ABI in jniLibs/.
      #     arm64-v8a is the one ~95% of modern Android phones want; users on
      #     it download ~half the bytes of the fat APK.
      #
      # We build --release (not --debug) so R8/minify/shrinkResources in
      # android/app/build.gradle actually fire. --debug builds skip the
      # release buildType entirely, so the v0.55 size work would be invisible.
      - name: Build fat (universal) APK — release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build per-ABI split APKs — release
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      # Fat APK = app-release.apk. Per-ABI APKs = app-arm64-v8a-release.apk,
      # app-armeabi-v7a-release.apk, app-x86_64-release.apk. Upload all 4.
      - name: Upload fat APK
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-fat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload per-ABI split APKs
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-split-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      # Legacy "all APKs" bucket — kept for backwards compat with any pinned
      # download links pointing at the old artifact name.
      - name: Upload all APKs (legacy bucket)
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-with-krita-engine
          path: build/app/outputs/flutter-apk/*.apk

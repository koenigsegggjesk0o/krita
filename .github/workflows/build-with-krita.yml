name: Build Feather-Krita with Krita Engine

on:
  workflow_dispatch:
  push:
    branches: [ feather-krita-flutter ]

jobs:
  build-windows-with-krita:
    name: Build Windows EXE with Krita Brush Engine
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Download Krita portable ZIP (contains all .dll)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.kde.org/stable/krita/6.0.3/krita-x64-6.0.3.zip" -OutFile krita-portable.zip
          Expand-Archive -Path krita-portable.zip -DestinationPath krita-files -Force
          Write-Host "Krita files extracted"

      - name: Copy Krita DLLs to Flutter project
        shell: pwsh
        run: |
          # Find Krita bin folder (might be different name)
          $kritaRoot = Get-ChildItem "krita-files" -Directory | Select-Object -First 1
          $kritaBin = Join-Path $kritaRoot.FullName "bin"
          Write-Host "Krita bin: $kritaBin"
          
          if (-not (Test-Path $kritaBin)) {
            Write-Host "ERROR: Krita bin folder not found!"
            Write-Host "Contents of krita-files:"
            Get-ChildItem "krita-files" -Recurse -Depth 1 | Format-Table FullName
            exit 1
          }
          
          $destDir = "krita-dlls"
          New-Item -ItemType Directory -Force -Path $destDir
          
          # Copy ALL dlls from Krita bin
          Get-ChildItem "$kritaBin\*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $destDir -Force
            Write-Host "Copied: $($_.Name)"
          }
          
          Write-Host "=== Total DLLs copied ==="
          (Get-ChildItem $destDir -Filter "*.dll").Count

      - name: Build Flutter Windows
        shell: pwsh
        run: |
          flutter build windows --release 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed, trying debug build..."
            flutter build windows --debug 2>&1
          }

      - name: Copy Krita DLLs to build output
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "build\windows\x64\runner\Debug"
          }
          
          # Find Krita root
          $kritaRoot = Get-ChildItem "krita-files" -Directory | Select-Object -First 1
          $kritaBin = Join-Path $kritaRoot.FullName "bin"
          $kritaShare = Join-Path $kritaRoot.FullName "share\krita"
          
          Write-Host "Build dir: $buildDir"
          Write-Host "Krita bin: $kritaBin"
          
          # Copy ALL Krita DLLs
          Get-ChildItem "$kritaBin\*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $buildDir -Force
          }
          
          # Copy kritaplugins
          $pluginsSrc = Join-Path $kritaBin "kritaplugins"
          if (Test-Path $pluginsSrc) {
            $pluginsDst = Join-Path $buildDir "kritaplugins"
            New-Item -ItemType Directory -Force -Path $pluginsDst
            Get-ChildItem "$pluginsSrc\*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $pluginsDst -Force
            }
          }
          
          # Copy data (brushes, presets, bundles)
          if (Test-Path $kritaShare) {
            $dataDst = Join-Path $buildDir "data\krita"
            New-Item -ItemType Directory -Force -Path $dataDst
            Copy-Item $kritaShare -Destination $dataDst -Recurse -Force
          }
          
          Write-Host "=== Build output ==="
          Get-ChildItem $buildDir | Format-Table Name, Length
          Write-Host "=== kritaplugins ==="
          Get-ChildItem (Join-Path $buildDir "kritaplugins") -ErrorAction SilentlyContinue | Format-Table Name
          Write-Host "=== data ==="
          Get-ChildItem (Join-Path $buildDir "data") -ErrorAction SilentlyContinue | Format-Table Name

      - name: Package as ZIP
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "build\windows\x64\runner\Debug"
          }
          Compress-Archive -Path "$buildDir\*" -DestinationPath feather-krita-krita-engine.zip -Force
          Write-Host "ZIP created"
          Get-Item feather-krita-krita-engine.zip | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-windows-with-krita-engine
          path: feather-krita-krita-engine.zip
          retention-days: 90

  build-android-with-krita:
    name: Build Android APK with Krita Brush Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-with-krita-engine
          path: build/app/outputs/flutter-apk/*.apk

  compile-krita-bridge:
    name: Step 2 — Compile krita_bridge.dll
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt6 via aqtinstall (fast, pre-built)
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 --outputdir C:\Qt
          $qtDir = "C:\Qt\6.6.3\msvc2019_64"
          echo "Qt6_DIR=$qtDir" >> $env:GITHUB_ENV
          Write-Host "Qt6 installed at: $qtDir"
          Get-ChildItem "$qtDir\include" -Directory | Select-Object Name

      - name: Install Boost + Eigen via vcpkg (fast, pre-built)
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install boost-system:x64-windows boost-headers:x64-windows boost-algorithm:x64-windows eigen3:x64-windows --x-install-root=C:\vcpkg\installed

      - name: Install extra-cmake-modules
        run: |
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git C:\ecm
          cd C:\ecm
          cmake -B build -DCMAKE_INSTALL_PREFIX=C:\ecm-install
          cmake --build build --target install --config Release

      - name: Build lager + immer + zug + xsimd
        run: |
          $deps = "C:\krita-deps"
          New-Item -ItemType Directory -Force -Path $deps
          git clone --depth 1 https://github.com/arximboldi/immer.git C:\immer
          cd C:\immer; cmake -B build -DCMAKE_INSTALL_PREFIX=$deps -DBUILD_TESTING=OFF; cmake --build build --target install --config Release
          git clone --depth 1 https://github.com/arximboldi/zug.git C:\zug
          cd C:\zug; cmake -B build -DCMAKE_INSTALL_PREFIX=$deps -DBUILD_TESTING=OFF; cmake --build build --target install --config Release
          git clone --depth 1 https://github.com/arximboldi/lager.git C:\lager
          cd C:\lager; cmake -B build -DCMAKE_INSTALL_PREFIX=$deps -DBUILD_TESTING=OFF -Dlager_BUILD_DEBUGGER_EXAMPLES=OFF -Dlager_EMBED_RESOURCES_PATH=OFF; cmake --build build --target install --config Release
          git clone --depth 1 --branch 13.0.0 https://github.com/xtensor-stack/xsimd.git C:\xsimd
          cd C:\xsimd; cmake -B build -DCMAKE_INSTALL_PREFIX=$deps -DBUILD_TESTING=OFF; cmake --build build --target install --config Release

      - name: Download Krita portable ZIP
        run: |
          Invoke-WebRequest -Uri "https://download.kde.org/stable/krita/6.0.3/krita-x64-6.0.3.zip" -OutFile krita-portable.zip
          Expand-Archive -Path krita-portable.zip -DestinationPath C:\krita-portable -Force
          $kritaRoot = (Get-ChildItem "C:\krita-portable" -Directory | Select-Object -First 1).FullName
          echo "KRITA_ROOT=$kritaRoot" >> $env:GITHUB_ENV

      - name: Generate .lib import libraries from Krita .dll
        run: |
          $kritaBin = Join-Path $env:KRITA_ROOT "bin"
          $libDir = "C:\krita-libs"
          New-Item -ItemType Directory -Force -Path $libDir
          Get-ChildItem "$kritaBin\libkrita*.dll" | ForEach-Object {
            $defFile = Join-Path $libDir ($_.BaseName + ".def")
            "EXPORTS" | Out-File -FilePath $defFile -Encoding ASCII
            & dumpbin /exports $_.FullName 2>$null | Select-String -Pattern '^\s+\d+\s+[0-9A-F]+\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Out-File -FilePath $defFile -Encoding ASCII -Append
            $libPath = Join-Path $libDir ($_.BaseName + ".lib")
            & lib /def:$defFile /out:$libPath /machine:x64 2>$null
            if (Test-Path $libPath) { Write-Host "OK: $($_.BaseName).lib" } else { Write-Host "FAIL: $($_.BaseName).lib" }
          }
          # Also Qt6 dlls
          Get-ChildItem "$kritaBin\Qt6*.dll" | ForEach-Object {
            $defFile = Join-Path $libDir ($_.BaseName + ".def")
            "EXPORTS" | Out-File -FilePath $defFile -Encoding ASCII
            & dumpbin /exports $_.FullName 2>$null | Select-String -Pattern '^\s+\d+\s+[0-9A-F]+\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Out-File -FilePath $defFile -Encoding ASCII -Append
            $libPath = Join-Path $libDir ($_.BaseName + ".lib")
            & lib /def:$defFile /out:$libPath /machine:x64 2>$null
          }
          Write-Host "=== .lib files ==="
          Get-ChildItem $libDir -Filter "*.lib" | Format-Table Name

      - name: Clone Krita source (headers)
        run: git clone --depth 1 --branch v6.0.4 https://github.com/KDE/krita.git C:\krita-src

      - name: Generate stub export headers + KDE Frameworks stubs
        run: |
          $stubDir = "C:\krita-stubs"
          New-Item -ItemType Directory -Force -Path $stubDir
          
          # Krita export macros
          $exports = @(
            "kritapigment_export", "kritaimage_export", "kritabrush_export",
            "kritaui_export", "kritaresources_export", "kritaglobal_export",
            "kritawidgetutils_export", "kritaversion_export", "kritamultiarch_export",
            "kritacommand_export", "kritaflake_export", "kritabasicflakes_export",
            "kritawidgets_export", "kritastore_export", "kritakoplugin_export",
            "kritametadata_export", "kritalibkis_export", "kritalibkra_export",
            "kritapsd_export", "kritapsdutils_export", "kritaimpex_export",
            "kritalibpaintop_export", "kritaresourcewidgets_export",
            "kritaqmlwidgets_export", "kritaqmicinterface_export",
            "kritacolor_export", "kritaexifcommon_export", "kritatiffpsd_export"
          )
          foreach ($exp in $exports) {
            $macro = ($exp -replace '_export$','').ToUpper() + "_EXPORT"
            "#ifndef $($exp -replace '\.','_')_H`n#define $($exp -replace '\.','_')_H`n#define $macro`n#endif" | Out-File -FilePath (Join-Path $stubDir "$exp.h") -Encoding ASCII
          }
          
          # KDE Frameworks stubs
          # KI18n
          '#ifndef KLOCALIZEDSTRING_H
          #define KLOCALIZEDSTRING_H
          #include <QString>
          class KLocalizedString { QString m; public: KLocalizedString() {} KLocalizedString(const char* s) : m(QString::fromUtf8(s)) {} QString toString() const { return m; } operator QString() const { return m; } };
          inline KLocalizedString i18n(const char* text) { return KLocalizedString(text); }
          inline KLocalizedString i18nc(const char* ctx, const char* text) { return KLocalizedString(text); }
          inline KLocalizedString i18np(const char* sing, const char* plur, int) { return KLocalizedString(sing); }
          #endif' | Out-File -FilePath (Join-Path $stubDir "klocalizedstring.h") -Encoding ASCII
          
          # KConfig
          '#ifndef KSHAREDCONFIG_H
          #define KSHAREDCONFIG_H
          #include <QSharedPointer>
          #include <QSettings>
          class KConfig;
          typedef QSharedPointer<KConfig> KSharedConfigPtr;
          inline KSharedConfigPtr KSharedConfig::openConfig(const QString& = QString()) { return KSharedConfigPtr(); }
          #endif' | Out-File -FilePath (Join-Path $stubDir "ksharedconfig.h") -Encoding ASCII
          
          '#ifndef KCONFIG_H
          #define KCONFIG_H
          #include <QSettings>
          class KConfig : public QSettings { Q_OBJECT public: KConfig(const QString& f, QObject* p=nullptr) : QSettings(f, p) {} };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kconfig.h") -Encoding ASCII
          
          '#ifndef KCONFIGGROUP_H
          #define KCONFIGGROUP_H
          #include <QSettings>
          class KConfigGroup : public QSettings { Q_OBJECT public: KConfigGroup() : QSettings() {} template<typename T> KConfigGroup(T* p, const QString& g) : QSettings() { beginGroup(g); } QVariant readEntry(const QString& k, const QVariant& d=QVariant()) const { return d; } void writeEntry(const QString& k, const QVariant& v) {} bool hasKey(const QString& k) const { return false; } };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kconfiggroup.h") -Encoding ASCII
          
          # KCoreAddons
          '#ifndef KPLUGINFACTORY_H
          #define KPLUGINFACTORY_H
          #include <QObject>
          class KPluginFactory : public QObject { Q_OBJECT public: KPluginFactory() {} };
          #define K_PLUGIN_FACTORY(name, plugin) class name : public KPluginFactory { Q_OBJECT Q_PLUGIN_METADATA(IID "org.kde.KPluginFactory") public: name() {} };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kpluginfactory.h") -Encoding ASCII
          
          '#ifndef KPLUGINMETADATA_H
          #define KPLUGINMETADATA_H
          #include <QString>
          #include <QJsonObject>
          class KPluginMetaData { QString m_name; public: KPluginMetaData() {} QString name() const { return m_name; } QJsonObject rawData() const { return QJsonObject(); } bool isValid() const { return true; } };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kpluginmetadata.h") -Encoding ASCII
          
          # KStandardDirs
          '#ifndef KSTANDARDDIRS_H
          #define KSTANDARDDIRS_H
          #include <QString>
          #include <QStringList>
          class KStandardDirs { public: static QString installPath(const QString&) { return QString(); } static QStringList resourceDirs(const QString&) { return QStringList(); } static QString locate(const QString&, const QString&) { return QString(); } };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kstandarddirs.h") -Encoding ASCII
          
          # KDebug
          '#ifndef KDEBUG_H
          #define KDEBUG_H
          #include <QDebug>
          #define qCDebug(category) qDebug()
          #define qCWarning(category) qWarning()
          #define qCCritical(category) qCritical()
          #endif' | Out-File -FilePath (Join-Path $stubDir "kdebug.h") -Encoding ASCII
          
          # KXmlGui
          '#ifndef KXMLGUIWINDOW_H
          #define KXMLGUIWINDOW_H
          #include <QMainWindow>
          class KXmlGuiWindow : public QMainWindow { Q_OBJECT public: KXmlGuiWindow(QWidget* p=nullptr) : QMainWindow(p) {} };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kxmlguiwindow.h") -Encoding ASCII
          
          # KActionCollection
          '#ifndef KACTIONCOLLECTION_H
          #define KACTIONCOLLECTION_H
          #include <QObject>
          #include <QAction>
          class KActionCollection : public QObject { Q_OBJECT public: KActionCollection(QObject* p=nullptr) : QObject(p) {} QAction* addAction(const QString&, QAction* a=nullptr) { return a ? a : new QAction(this); } };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kactioncollection.h") -Encoding ASCII
          
          # KNotification
          '#ifndef KNOTIFICATION_H
          #define KNOTIFICATION_H
          #include <QString>
          class KNotification { public: static void event(const QString&, const QString&, const QString& = QString()) {} };
          #endif' | Out-File -FilePath (Join-Path $stubDir "knotification.h") -Encoding ASCII
          
          # KCompletion
          '#ifndef KCOMPLETION_H
          #define KCOMPLETION_H
          #include <QStringList>
          class KCompletion { public: QStringList items() const { return QStringList(); } void setItems(const QStringList&) {} };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kcompletion.h") -Encoding ASCII
          
          # KService
          '#ifndef KSERVICE_H
          #define KSERVICE_H
          #include <QString>
          class KService { QString m_name; public: QString name() const { return m_name; } QString storageId() const { return QString(); } };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kservice.h") -Encoding ASCII
          
          # KIconLoader
          '#ifndef KICONLOADER_H
          #define KICONLOADER_H
          #include <QIcon>
          class KIconLoader { public: QIcon loadIcon(const QString&, int=0, int=0) const { return QIcon(); } };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kiconloader.h") -Encoding ASCII
          
          # KMessageBox
          '#ifndef KMESSAGEBOX_H
          #define KMESSAGEBOX_H
          #include <QString>
          class KMessageBox { public: static void information(QWidget*, const QString&, const QString& = QString()) {} static void error(QWidget*, const QString&, const QString& = QString()) {} static int questionYesNo(QWidget*, const QString&, const QString& = QString()) { return 1; } };
          #endif' | Out-File -FilePath (Join-Path $stubDir "kmessagebox.h") -Encoding ASCII
          
          # Krita generated config headers (use `n for newlines in PowerShell)
          "#ifndef KOCONFIG_H`n#define KOCONFIG_H`n#define HAVE_XSIMD 1`n#define HAVE_LCMS24 1`n#define HAVE_GSL 1`n#endif" | Out-File -FilePath (Join-Path $stubDir "KoConfig.h") -Encoding ASCII
          "#ifndef KOTESTCONFIG_H`n#define KOTESTCONFIG_H`n#endif" | Out-File -FilePath (Join-Path $stubDir "KoTestConfig.h") -Encoding ASCII
          "#ifndef CONFIG_HDR_H`n#define CONFIG_HDR_H`n#endif" | Out-File -FilePath (Join-Path $stubDir "config-hdr.h") -Encoding ASCII
          "#ifndef CONFIG_GSL_H`n#define CONFIG_GSL_H`n#endif" | Out-File -FilePath (Join-Path $stubDir "config-gsl.h") -Encoding ASCII
          "#ifndef CONFIG_HASH_TABLE_IMPLEMENTATION_H`n#define CONFIG_HASH_TABLE_IMPLEMENTATION_H`n#define HAVE_CONCURRENT_HASH_TABLE 1`n#endif" | Out-File -FilePath (Join-Path $stubDir "config-hash-table-implementation.h") -Encoding ASCII
          "#ifndef CONFIG_SAFE_ASSERTS_H`n#define CONFIG_SAFE_ASSERTS_H`n#define KRITASAFEASSERT_CRASH 0`n#endif" | Out-File -FilePath (Join-Path $stubDir "config-safe-asserts.h") -Encoding ASCII
          "#ifndef CONFIG_USE_SURFACE_COLOR_MANAGEMENT_API_H`n#define CONFIG_USE_SURFACE_COLOR_MANAGEMENT_API_H`n#define HAVE_SURFACE_COLOR_MANAGEMENT_API 0`n#endif" | Out-File -FilePath (Join-Path $stubDir "config-use-surface-color-management-api.h") -Encoding ASCII
          
          Write-Host "Generated $($exports.Count) Krita export + 15 KDE Frameworks stub headers"

      - name: Compile krita_bridge.cpp
        run: |
          $kritaSrc = "C:\krita-src"
          $libDir = "C:\krita-libs"
          $vcpkgDir = "C:\vcpkg\installed\x64-windows"
          $depsDir = "C:\krita-deps"
          
          # Find Qt6 path from install-qt-action
          $qtDir = $env:Qt6_DIR -replace '\\lib\\cmake\\Qt6$', ''
          if (-not $qtDir) { $qtDir = (Get-ChildItem "C:\Qt\6.*\msvc*" -Directory | Select-Object -First 1).FullName }
          Write-Host "Qt6 dir: $qtDir"
          
          $qtInclude = Join-Path $qtDir "include"
          $qtLib = Join-Path $qtDir "lib"
          
          $includePaths = @(
            "native\krita_bridge", "C:\krita-stubs",
            "$kritaSrc\libs\brush", "$kritaSrc\libs\image",
            "$kritaSrc\libs\image\brushengine", "$kritaSrc\libs\pigment",
            "$kritaSrc\libs\widgetutils", "$kritaSrc\libs\global",
            "$kritaSrc\libs\resources", "$kritaSrc\libs\command",
            "$kritaSrc\libs\flake", "$kritaSrc\libs\basicflakes",
            "$kritaSrc\libs\ui", "$kritaSrc\libs\widgets", "$kritaSrc\libs\store",
            "$kritaSrc\libs\koplugin", "$kritaSrc\libs\metadata",
            "$kritaSrc\libs\version", "$kritaSrc\libs\multiarch",
            "$kritaSrc\libs\psd", "$kritaSrc\libs\psdutils",
            "$kritaSrc\libs\resourcewidgets", "$kritaSrc\libs\impex",
            "$kritaSrc\libs\libkis", "$kritaSrc\libs\libkra",
            "$kritaSrc\krita", "$vcpkgDir\include",
            "$qtInclude", "$qtInclude\QtCore", "$qtInclude\QtGui",
            "$qtInclude\QtWidgets", "$qtInclude\QtXml",
            "$qtInclude\QtSvg", "$qtInclude\QtConcurrent",
            "$depsDir\include", "C:\ecm-install\include"
          )
          $incArgs = ($includePaths | ForEach-Object { "-I`"$_`"" }) -join " "
          
          # Collect .lib files (Krita import libs + Qt6 libs)
          $libFiles = @()
          Get-ChildItem "$libDir\*.lib" | ForEach-Object { $libFiles += $_.FullName }
          # Qt6 libs
          $qtLibs = @("Qt6Core.lib", "Qt6Gui.lib", "Qt6Widgets.lib", "Qt6Xml.lib", "Qt6Svg.lib", "Qt6Concurrent.lib", "Qt6Network.lib")
          foreach ($ql in $qtLibs) {
            $qp = Join-Path $qtLib $ql
            if (Test-Path $qp) { $libFiles += $qp }
          }
          # Boost
          $boostLib = Join-Path $vcpkgDir "lib\libboost_system.lib"
          if (Test-Path $boostLib) { $libFiles += $boostLib }
          
          $libArgs = ($libFiles | ForEach-Object { "`"$_`"" }) -join " "
          $defines = "/DKRITA_VERSION_STRING=`"6.0.4`" /DGENERIC_KRITA_LIB_VERSION=21 /DGENERIC_KRITA_LIB_SOVERSION=21 /DQT_CORE_LIB /DQT_GUI_LIB /DQT_WIDGETS_LIB /DQT_XML_LIB /DQT_SVG_LIB /DQT_CONCURRENT_LIB /DQT_NO_DEBUG /DNDEBUG /D_USE_MATH_DEFINES"
          
          Write-Host "=== Compiling krita_bridge.cpp ==="
          Write-Host "Include paths: $($includePaths.Count)"
          Write-Host "Lib files: $($libFiles.Count)"
          
          # Write compile command to batch file (fix PowerShell quote issue)
          $cmd = "cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /Zc:preprocessor /EHsc /MD /O2 /LD $incArgs $defines native\krita_bridge\krita_bridge.cpp /Fe:krita_bridge.dll /link $libArgs /SUBSYSTEM:CONSOLE /MACHINE:X64"
          $cmd | Out-File -FilePath compile.bat -Encoding ASCII -Force
          Write-Host "Command: $cmd"
          cmd /c compile.bat 2>&1
          
          if (Test-Path krita_bridge.dll) {
            Write-Host "SUCCESS: krita_bridge.dll compiled"
            Get-Item krita_bridge.dll | Format-Table Name, Length
          } else {
            Write-Host "FAILED"
            exit 1
          }

      - name: Upload krita_bridge.dll
        uses: actions/upload-artifact@v4
        with:
          name: krita-bridge-dll
          path: krita_bridge.dll
          retention-days: 90

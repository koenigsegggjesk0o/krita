name: Build Feather-Krita with Krita Engine

# =============================================================================
# v0.58-CI — COMPILE KRITA ENGINE FROM SOURCE.
# =============================================================================
# This workflow compiles the Krita engine (krita-source/ — 12,325 files,
# 5,942 C++ files from KDE/krita tag v6.0.4) FROM SOURCE on a windows-latest
# runner. It does NOT download any pre-compiled Krita binaries from krita.org.
#
# Honest binary-dep inventory (see worklog v58-compile-krita-source):
#   * Qt6            = PRE-BUILT binary via aqtinstall (compiling Qt from
#                      source would take 8+ hours, exceeds GitHub Actions
#                      6h job limit — UNAVOIDABLE without a build server).
#   * Krita deps     = vcpkg binary default triplet (boost/eigen/exiv2/lcms2/
#                      zlib/png/jpeg/gif/openexr/quazip). vcpkg CAN rebuild
#                      these from source with `--build-from-source` (+2h).
#   * Krita engine   = COMPILED FROM SOURCE in this workflow (krita-source/).
#   * krita_bridge   = COMPILED FROM SOURCE in this workflow
#                      (native/krita_bridge/krita_bridge_real.cpp, 2,200 LOC,
#                       28 real Krita #includes incl. <kis_brush.h>,
#                       <KoColor.h>, <KisAutoBrush.h>).
#
# See anti-hallucination rules: every CI claim below has a file:line proof
# in the comments next to the step that makes the claim.
# =============================================================================

on:
  workflow_dispatch:
  push:
    branches: [ feather-krita-flutter ]

jobs:
  compile-krita-bridge:
    name: Compile Krita engine + krita_bridge.dll FROM SOURCE
    runs-on: windows-latest
    # windows-latest = 4 vCPU, 16 GB RAM, 14 GB SSD (per GitHub docs 2024).
    # Build time for the requested Krita lib targets at -j 2 is estimated
    # 1–3 hours; we allow up to 6 h (GitHub Actions hard ceiling).
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # --------------------------------------------------------------------------
      # Step 1: MSVC dev environment (cl.exe, link.exe, dumpbin.exe on PATH).
      # --------------------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------------------------------
      # Step 1a: Qt6 via aqtinstall.
      # PRE-BUILT binary. Compiling Qt from source = 8+ hours, exceeds 6h job
      # limit (see honesty rule). Acceptance required.
      # --------------------------------------------------------------------------
      - name: Install Qt6 via aqtinstall
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 --outputdir C:\Qt
          # Verify Qt install path (used by both cmake -DCMAKE_PREFIX_PATH and
          # the cl /I include path / /LIBPATH lib path in Step 4).
          if (-not (Test-Path "C:\Qt\6.6.3\msvc2019_64\lib\Qt6Core.lib")) {
            Write-Host "FATAL: Qt6Core.lib not found at expected path"
            exit 1
          }
          Write-Host "Qt6 installed at C:\Qt\6.6.3\msvc2019_64"

      # --------------------------------------------------------------------------
      # Step 1b: vcpkg for Krita's third-party deps.
      # windows-latest ships vcpkg at C:\vcpkg (pre-installed). We use classic
      # mode + the default (binary) triplet. Add `--build-from-source` if the
      # user requires source builds of these deps (adds ~2h to job time).
      #
      # Dep list verified against krita-source/CMakeLists.txt find_package():
      #   REQUIRED deps (configure fails without these):
      #     - ECM 6.0                (line 468)  → vcpkg port: extra-cmake-modules
      #     - KF6 6.0 COMPONENTS     (line 548)  → vcpkg ports: kf6config, kf6widgetsaddons,
      #       Config, WidgetsAddons,                kf6completion, kf6coreaddons, kf6guiaddons,
      #       Completion, CoreAddons,               kf6i18n, kf6itemviews
      #       GuiAddons, I18n, ItemViews
      #     - PNG 1.2.6              (line 1148) → vcpkg port: libpng
      #     - Boost 1.69             (line 1161) → vcpkg port: boost (meta)
      #     - Immer                  (line 1181) → vcpkg port: immer
      #     - Zug                    (line 1182) → vcpkg port: zug
      #     - Lager                  (line 1183) → vcpkg port: lager
      #     - ZLIB                   (line 1226) → vcpkg port: zlib
      #     - Eigen3                 (line 1401) → vcpkg port: eigen3
      #     - LibExiv2 0.16          (line 1413) → vcpkg port: exiv2
      #     - LCMS2 2.4              (line 1418) → vcpkg port: lcms
      #       (vcpkg port name is `lcms`, NOT `lcms2` — port provides liblcms2.
      #        First CI run failed with `lcms2 does not exist` error; fixed.)
      #   Optional but commonly-needed deps (NOT REQUIRED in CMakeLists.txt):
      #     - OpenEXR, libjpeg-turbo, giflib, quazip, fftw3, gsl
      # --------------------------------------------------------------------------
      - name: Install Krita third-party deps via vcpkg
        shell: pwsh
        run: |
          # vcpkg is pre-installed at C:\vcpkg on windows-latest.
          & "C:\vcpkg\vcpkg.exe" --version
          # vCPKG_ROOT env on the runner sometimes points at an MSVC-internal
          # vcpkg; force the canonical C:\vcpkg location.
          $env:VCPKG_ROOT = "C:\vcpkg"
          # Install Krita's REQUIRED find_package() deps (verified above).
          # Note: kf6* ports will transitively install vcpkg's qtbase — that
          # is a SEPARATE Qt6 from aqtinstall's. We don't use it for cl.exe
          # paths (Step 4 uses aqtinstall's Qt6), but vcpkg's qtbase must be
          # present so vcpkg can build kf6* at all. This wastes ~1.5 GB disk
          # and ~10 min, but is unavoidable given the spec's "keep aqtinstall"
          # directive AND Krita's hard KF6 dependency.
          & "C:\vcpkg\vcpkg.exe" install `
            extra-cmake-modules `
            kf6config kf6widgetsaddons kf6completion kf6coreaddons `
            kf6guiaddons kf6i18n kf6itemviews `
            immer zug lager `
            boost-filesystem boost-system boost-interprocess boost-thread `
            eigen3 exiv2 lcms zlib libpng libjpeg-turbo giflib `
            openexr quazip fftw3 gsl `
            --triplet x64-windows
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FATAL: vcpkg install failed (exit $LASTEXITCODE)"
            exit 1
          }
          # Make vcpkg packages discoverable to CMake via the toolchain file.
          & "C:\vcpkg\vcpkg.exe" integrate install

      # --------------------------------------------------------------------------
      # Step 2: Configure Krita source with CMake.
      #
      # Sources: krita-source/ (12,325 files, 5,942 C++ — KDE/krita tag
      # v6.0.4). We build ONLY the lib targets needed by
      # native/krita_bridge/krita_bridge_real.cpp (the REAL bridge, 2,200 LOC,
      # 28 real Krita #includes). UI and plugins are NOT built (saves RAM +
      # build time). Configure still scans all subdirs (Krita's
      # CMakeLists.txt unconditionally add_subdirectory(libs/*)) but only
      # the requested --target list is actually compiled in Step 3.
      #
      # Note on target names (verified against krita-source/libs/*/CMakeLists.txt):
      #   * libs/brush/CMakeLists.txt:28 → target = kritalibbrush
      #     (NOT "kritabrush" — the export macro BASE_NAME is kritabrush, but
      #      the CMake target / .lib / .dll file name is "kritalibbrush").
      #   * libs/image/CMakeLists.txt:372  → target = kritaimage
      #   * libs/pigment/CMakeLists.txt:81 → target = kritapigment
      #   * libs/resources/CMakeLists.txt:64 → target = kritaresources
      #   * libs/version/CMakeLists.txt:11  → target = kritaversion
      #   * libs/global/CMakeLists.txt:71   → target = kritaglobal
      #   * libs/flake/CMakeLists.txt:264   → target = kritaflake
      #   * libs/command/CMakeLists.txt:16  → target = kritacommand
      # --------------------------------------------------------------------------
      - name: Configure Krita source (cmake -S krita-source -B krita-build)
        shell: pwsh
        run: |
          $qtDir = "C:\Qt\6.6.3\msvc2019_64"
          $vcpkgToolchain = "C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

          # Verify source tree is present (anti-hallucination: the spec
          # asserts 12,325 files / 5,942 C++ files; confirm a key header
          # before claiming "Krita source is here").
          if (-not (Test-Path "krita-source\libs\brush\kis_brush.h")) {
            Write-Host "FATAL: krita-source/libs/brush/kis_brush.h missing — krita-source/ not checked out"
            exit 1
          }
          Write-Host "Verified: krita-source/libs/brush/kis_brush.h present"

          # CMake configure. -DBUILD_WITH_QT6=ON is the real Krita option
          # (krita-source/CMakeLists.txt:14: option(BUILD_WITH_QT6 ...)).
          # Krita 6.0.4 still considers Qt6 builds "not yet production-ready"
          # (krita-source/CMakeLists.txt:375 message(FATAL_ERROR ...) unless
          # ALLOW_UNSTABLE contains "QT6") — pass -DALLOW_UNSTABLE=QT6 to
          # bypass (we are not packaging a stable release; we are building
          # the engine libs for FFI consumption). First CI run failed here
          # without this flag; fixed.
          # The spec's -DWITH_PYTHON=OFF / -DWITH_QT_XMLPATTERNS=OFF /
          # -DBUILD_LIB_KRITA_UI=OFF / -DBUILD_LIB_KRITA_PLUGIN=OFF options
          # are passed through verbatim per the spec — Krita's CMake will
          # cache unknown -D vars without error, and the spec's intent
          # (skip UI/plugins) is realised by Step 3's --target list (we
          # only build the listed lib targets; UI/plugin targets are not
          # in the --target list so they are not compiled).
          cmake -S krita-source -B krita-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=krita-install `
            -DCMAKE_PREFIX_PATH="$qtDir" `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
            -DBoost_NO_BOOST_CMAKE=ON `
            -DBUILD_TESTING=OFF `
            -DBUILD_WITH_QT6=ON `
            -DALLOW_UNSTABLE=QT6 `
            -DBUILD_KRITA_QT_DESIGNER=OFF `
            -DWITH_PYTHON=OFF `
            -DWITH_QT_XMLPATTERNS=OFF `
            -DKRITA_ENABLE_PCH=OFF `
            -DHAVE_MEMORY_LEAK_TRACKER=OFF `
            -DBUILD_LIB_KRITA_UI=OFF `
            -DBUILD_LIB_KRITA_PLUGIN=OFF
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FATAL: Krita cmake configure failed (exit $LASTEXITCODE)"
            Write-Host "Likely cause: missing find_package() dep — check vcpkg install list in Step 1b."
            exit 1
          }
          Write-Host "SUCCESS: Krita cmake configure passed (krita-build/ generated)"

      # --------------------------------------------------------------------------
      # Step 3: Build only the Krita lib targets needed by krita_bridge_real.cpp.
      #
      # -j 2 to stay within the 16 GB RAM budget on windows-latest. CMake/Ninja
      # will transitively build the listed targets' dependencies (kritamultiarch,
      # kritastore, kritawidgetutils, kritawidgets, koplugin, etc.) automatically.
      #
      # If this step OOMs (compiler process killed, link out-of-memory),
      # the fix is to re-run with `-j 1` (slower but bounded RAM).
      # If this step times out at 360 min, the fix is to drop the --target
      # list down to the three core libs: kritaimage kritalibbrush kritapigment.
      # --------------------------------------------------------------------------
      - name: Build Krita lib targets (-j 2, bounded RAM)
        shell: pwsh
        run: |
          # Targets verified to exist against krita-source/libs/*/CMakeLists.txt
          # (see file:line proofs in the Step 2 comment block above).
          cmake --build krita-build `
            --target kritaimage kritalibbrush kritapigment kritaresources `
                   kritaversion kritaglobal kritaflake kritacommand `
            -j 2
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FATAL: Krita lib build failed (exit $LASTEXITCODE)"
            Write-Host "If OOM: re-run with -j 1."
            Write-Host "If timeout: drop --target list to kritaimage kritalibbrush kritapigment."
            exit 1
          }

          # Verify that the expected .lib/.dll artifacts were produced.
          # Krita's CMake puts SHARED libs in <build>/bin/*.dll and the
          # import libs in <build>/lib/*.lib (verified by kis_add_library
          # + the ARCHIVE/LIBRARY/RUNTIME output dirs in KritaMacros.cmake).
          $expectedLibs = @(
            "krita-build\lib\kritaimage.lib",
            "krita-build\lib\kritalibbrush.lib",
            "krita-build\lib\kritapigment.lib",
            "krita-build\lib\kritaresources.lib",
            "krita-build\lib\kritaversion.lib",
            "krita-build\lib\kritaglobal.lib",
            "krita-build\lib\kritaflake.lib",
            "krita-build\lib\kritacommand.lib"
          )
          $missing = @()
          foreach ($lib in $expectedLibs) {
            if (-not (Test-Path $lib)) { $missing += $lib }
          }
          if ($missing.Count -gt 0) {
            Write-Host "FATAL: Expected Krita .lib files missing:"
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "SUCCESS: All 8 Krita .lib import libs produced in krita-build\lib\"

          # List the built .dll files for the worklog (artifact inventory).
          Write-Host "=== Built Krita .dll files (krita-build\bin\): ==="
          Get-ChildItem "krita-build\bin\krita*.dll" -ErrorAction SilentlyContinue |
            Select-Object Name, @{N="SizeKB";E={[math]::Round($_.Length/1KB,1)}} |
            Format-Table -AutoSize

      # --------------------------------------------------------------------------
      # Step 4: Compile krita_bridge_real.cpp against the built Krita libs.
      #
      # Source: native/krita_bridge/krita_bridge_real.cpp — 2,200 LOC, 28 real
      # Krita #includes including <kis_brush.h>, <KoColor.h>, <KisAutoBrush.h>
      # (verified at native/krita_bridge/krita_bridge_real.cpp:44-95).
      # Output: krita_bridge.dll — the C ABI bridge loaded by Flutter FFI.
      # --------------------------------------------------------------------------
      - name: Compile krita_bridge.dll from krita_bridge_real.cpp
        shell: pwsh
        run: |
          $qtDir     = "C:\Qt\6.6.3\msvc2019_64"
          $vcpkgInc  = "C:\vcpkg\installed\x64-windows\include"
          $vcpkgLib  = "C:\vcpkg\installed\x64-windows\lib"

          # Anti-hallucination: confirm we are compiling the REAL bridge,
          # not the 712-LOC stub krita_bridge.cpp. The real file is 2,200
          # LOC and includes real Krita headers (verified locally:
          # wc -l krita_bridge_real.cpp = 2200; rg '#include <kis_' = 28 hits).
          if (-not (Test-Path "native\krita_bridge\krita_bridge_real.cpp")) {
            Write-Host "FATAL: native/krita_bridge/krita_bridge_real.cpp missing"
            exit 1
          }
          $realLines = (Get-Content "native\krita_bridge\krita_bridge_real.cpp" | Measure-Object -Line).Lines
          Write-Host "krita_bridge_real.cpp = $realLines lines (expected ~2200)"
          if ($realLines -lt 1500) {
            Write-Host "FATAL: krita_bridge_real.cpp unexpectedly short — refusing to compile a stub"
            exit 1
          }

          # Include paths. Each path maps to a real Krita header that
          # krita_bridge_real.cpp #includes (verified at lines 44–95 of
          # that file). The krita-build/ include dir is needed for the
          # generated export headers (kritabrush_export.h, kritaimage_export.h,
          # KoConfig.h, etc.) and kis_brush_interface.moc.
          $incPaths = @(
            "-I`"native\krita_bridge`"",
            "-I`"krita-source\libs\brush`"",
            "-I`"krita-source\libs\image`"",
            "-I`"krita-source\libs\image\brushengine`"",
            "-I`"krita-source\libs\pigment`"",
            "-I`"krita-source\libs\resources`"",
            "-I`"krita-source\libs\version`"",
            "-I`"krita-source\libs\global`"",
            "-I`"krita-source\libs\flake`"",
            "-I`"krita-source\libs\command`"",
            "-I`"krita-source\libs\koplugin`"",
            "-I`"krita-source\libs\store`"",
            "-I`"krita-build\libs\brush`"",
            "-I`"krita-build\libs\image`"",
            "-I`"krita-build\libs\pigment`"",
            "-I`"krita-build\libs\resources`"",
            "-I`"krita-build\libs\version`"",
            "-I`"krita-build\libs\global`"",
            "-I`"krita-build\libs\flake`"",
            "-I`"krita-build\libs\command`"",
            "-I`"krita-build`"",
            "-I`"$qtDir\include`"",
            "-I`"$qtDir\include\QtCore`"",
            "-I`"$qtDir\include\QtGui`"",
            "-I`"$qtDir\include\QtWidgets`"",
            "-I`"$qtDir\include\QtXml`"",
            "-I`"$qtDir\include\QtSvg`"",
            "-I`"$vcpkgInc`""
          )
          $incArgs = $incPaths -join " "

          # Link the 8 Krita libs we built in Step 3 (verified .lib paths
          # in Step 3's verification block) + the Qt6 libs from aqtinstall
          # + vcpkg deps. /LIBPATH order: krita-build first (so the freshly
          # built libkrita*.lib is resolved before any system Qt/vcpkg lib
          # of the same name — there shouldn't be any, but be safe).
          $libs = @(
            "/LIBPATH:`"krita-build\lib`"",
            "/LIBPATH:`"krita-build\bin`"",
            "/LIBPATH:`"$qtDir\lib`"",
            "/LIBPATH:`"$vcpkgLib`"",
            "kritaimage.lib",
            "kritalibbrush.lib",
            "kritapigment.lib",
            "kritaresources.lib",
            "kritaversion.lib",
            "kritaglobal.lib",
            "kritaflake.lib",
            "kritacommand.lib",
            "Qt6Core.lib",
            "Qt6Gui.lib",
            "Qt6Widgets.lib",
            "Qt6Xml.lib",
            "Qt6Svg.lib"
          )
          $libArgs = $libs -join " "

          $defines = "/DQT_CORE_LIB /DQT_GUI_LIB /DQT_XML_LIB /DQT_NO_DEBUG /DNDEBUG /D_USE_MATH_DEFINES /DCMAKE_INTDIR=Release"

          # cl command line. /std:c++17 matches Krita's CMake (krita-source/
          # CMakeLists.txt:38 set(CMAKE_CXX_STANDARD 17)). /permissive- +
          # /Zc:preprocessor + /Zc:__cplusplus match MSVC's standards-conformant
          # mode (required for some Krita headers).
          $cmd = "cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /Zc:preprocessor /EHsc /MD /O2 /LD $incArgs $defines native\krita_bridge\krita_bridge_real.cpp /Fe:krita_bridge.dll /link $libArgs /SUBSYSTEM:CONSOLE /MACHINE:X64"

          Write-Host "=== cl command ==="
          Write-Host $cmd
          $cmd | Out-File -FilePath compile_bridge.bat -Encoding ASCII -Force
          cmd /c compile_bridge.bat 2>&1
          $clExit = $LASTEXITCODE

          if ($clExit -ne 0) {
            Write-Host "FATAL: cl.exe failed to compile/link krita_bridge.dll (exit $clExit)"
            exit 1
          }
          if (-not (Test-Path "krita_bridge.dll")) {
            Write-Host "FATAL: krita_bridge.dll not produced despite cl exit 0"
            exit 1
          }
          $dllSize = (Get-Item "krita_bridge.dll").Length
          Write-Host "SUCCESS: krita_bridge.dll compiled, size = $([math]::Round($dllSize/1KB,1)) KB"

      # --------------------------------------------------------------------------
      # Step 5: Verify krita_bridge.dll is the REAL bridge.
      #
      # (a) Size > 100 KB: a stub DLL would be ~10-30 KB; a real one linked
      #     against 8 Krita libs + Qt6 must be > 100 KB.
      # (b) Export table contains `krita_brush_generate_dab` (declared at
      #     native/krita_bridge/krita_bridge.h:203, defined at
      #     native/krita_bridge/krita_bridge_real.cpp:1782, exported via
      #     KRITA_BRIDGE_API = __declspec(dllexport) at krita_bridge.h:32).
      # (c) Import table contains `libkritaimage.dll` (proves the DLL was
      #     linked against the Krita engine built in Step 3, not a stub).
      # --------------------------------------------------------------------------
      - name: Verify krita_bridge.dll (size + exports + imports)
        shell: pwsh
        run: |
          $dll = "krita_bridge.dll"
          $size = (Get-Item $dll).Length
          Write-Host "=== krita_bridge.dll size: $([math]::Round($size/1KB,1)) KB ==="
          if ($size -lt 100KB) {
            Write-Host "FATAL: krita_bridge.dll is only $([math]::Round($size/1KB,1)) KB — looks like a stub, not the real bridge"
            exit 1
          }

          Write-Host "=== dumpbin /exports krita_bridge.dll (first 30) ==="
          $exports = & dumpbin /exports $dll 2>&1 | Out-String
          Write-Host $exports.Substring(0, [Math]::Min(4000, $exports.Length))

          if ($exports -notmatch "krita_brush_generate_dab") {
            Write-Host "FATAL: export table missing krita_brush_generate_dab — bridge is not real"
            exit 1
          }
          Write-Host "PASS: krita_brush_generate_dab present in export table"

          Write-Host "=== dumpbin /imports krita_bridge.dll (libkrita* section) ==="
          $imports = & dumpbin /imports $dll 2>&1 | Out-String
          $kritaImports = ($imports -split "`r?`n" | Where-Object { $_ -match "libkrita" })
          $kritaImports | ForEach-Object { Write-Host $_ }
          if ($kritaImports.Count -eq 0) {
            Write-Host "FATAL: import table has no libkrita*.dll entry — krita_bridge.dll was NOT linked against the Krita engine"
            exit 1
          }
          Write-Host "PASS: krita_bridge.dll imports at least one libkrita*.dll"

          # Save the verification report for the worklog.
          "krita_bridge.dll size: $([math]::Round($size/1KB,1)) KB" | Out-File -FilePath verify_report.txt -Encoding ASCII
          "Exports (krita_*):" | Out-File -FilePath verify_report.txt -Append -Encoding ASCII
          ($exports -split "`r?`n" | Where-Object { $_ -match "krita_" }) |
            Out-File -FilePath verify_report.txt -Append -Encoding ASCII
          "Imports (libkrita*):" | Out-File -FilePath verify_report.txt -Append -Encoding ASCII
          $kritaImports | Out-File -FilePath verify_report.txt -Append -Encoding ASCII

      # --------------------------------------------------------------------------
      # Step 6a: Upload krita_bridge.dll artifact (consumed by Job 2).
      # --------------------------------------------------------------------------
      - name: Upload krita_bridge.dll
        uses: actions/upload-artifact@v4
        with:
          name: krita-bridge-dll
          path: |
            krita_bridge.dll
            verify_report.txt
          retention-days: 90

      # --------------------------------------------------------------------------
      # Step 6b: Upload the built Krita engine .dll files (libkrita*.dll).
      # These are the COMPILED-FROM-SOURCE Krita engine DLLs produced by
      # Step 3. They are consumed by Job 2 to bundle into the Flutter
      # Windows release folder (replacing the old "Download Krita portable
      # ZIP from krita.org" step).
      # --------------------------------------------------------------------------
      - name: Upload built Krita engine DLLs (libkrita*.dll from krita-build/bin)
        uses: actions/upload-artifact@v4
        with:
          name: krita-engine-dlls
          path: krita-build/bin/krita*.dll
          retention-days: 90

  build-windows-with-krita:
    name: Build Windows EXE with Krita Engine
    runs-on: windows-latest
    needs: compile-krita-bridge
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Download krita_bridge.dll
        uses: actions/download-artifact@v4
        with:
          name: krita-bridge-dll
          path: .

      # --------------------------------------------------------------------------
      # v0.58: OLD step "Download Krita portable ZIP from krita.org" REMOVED.
      # Replaced by downloading the libkrita*.dll artifact that Job 1 compiled
      # FROM SOURCE (krita-source/). NO download from krita.org.
      # --------------------------------------------------------------------------
      - name: Download built Krita engine DLLs (from Job 1)
        uses: actions/download-artifact@v4
        with:
          name: krita-engine-dlls
          path: krita-engine-bin

      - name: Build Flutter Windows
        run: flutter build windows --release

      - name: Copy Krita DLLs + bridge + data to build output
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $buildDir)) { throw "Flutter build output dir missing: $buildDir" }

          # Anti-hallucination: confirm krita_bridge.dll is the REAL bridge,
          # not a stub. The verify_report.txt from Job 1 is the proof.
          if (Test-Path "verify_report.txt") {
            Write-Host "=== krita_bridge.dll verification report (from Job 1) ==="
            Get-Content verify_report.txt
          }
          $bridgeSize = (Get-Item "krita_bridge.dll").Length
          if ($bridgeSize -lt 100KB) {
            throw "krita_bridge.dll is only $([math]::Round($bridgeSize/1KB,1)) KB — refusing to bundle a stub"
          }
          Write-Host "krita_bridge.dll = $([math]::Round($bridgeSize/1KB,1)) KB (REAL bridge, >100 KB threshold)"

          # Copy ALL built Krita engine DLLs (libkritaimage.dll, libkritalibbrush.dll,
          # libkritapigment.dll, ...) compiled by Job 1 from krita-source/.
          Write-Host "=== Built Krita engine DLLs being bundled (FROM SOURCE) ==="
          Get-ChildItem "krita-engine-bin\*.dll" | ForEach-Object {
            Write-Host "  $($_.Name) — $([math]::Round($_.Length/1KB,1)) KB"
            Copy-Item $_.FullName -Destination $buildDir -Force
          }

          # Copy krita_bridge.dll (the C ABI wrapper, also FROM SOURCE).
          Copy-Item "krita_bridge.dll" -Destination $buildDir -Force
          Write-Host "Copied krita_bridge.dll"

          # Copy krita-data.zip (727 brush presets — data, not engine).
          if (Test-Path "assets\krita-data.zip") {
            Copy-Item "assets\krita-data.zip" -Destination $buildDir -Force
            Write-Host "Copied krita-data.zip"
          }

          # Total size
          $totalSize = (Get-ChildItem $buildDir -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "=== Total build size: $([math]::Round($totalSize / 1MB, 1)) MB ==="

      # NOTE (v0.57-fix): upload the Release/ DIRECTORY directly, not a
      # pre-zipped file. `actions/upload-artifact@v4` already wraps the
      # upload in its own zip — uploading a .zip would create a NESTED
      # zip (user downloads X.zip → extracts → gets another Y.zip → extracts
      # again → finally gets the .exe). Uploading the folder means the user
      # downloads ONE zip, extracts ONCE, and gets feather_krita.exe +
      # krita_bridge.dll + all the Krita data files ready to run.
      - name: Upload Windows build (folder, no nested zip)
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-windows-with-krita-engine
          path: build/windows/x64/runner/Release/*
          retention-days: 90

  build-android-with-krita:
    name: Build Android APK with Krita Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # v0.55-C: Android APK size optimization.
      #
      # Build BOTH a fat (universal) APK and per-ABI split APKs so users can
      # pick the smallest artifact for their device:
      #
      #   * Fat APK (~190–257 MB pre-v0.55, ~110–160 MB post-v0.55 with R8 +
      #     resource shrinking + abiFilters=arm64-v8a,x86_64) — universal,
      #     works on any device the abiFilters allow.
      #   * Per-ABI APKs (~60–120 MB each) — one per ABI in jniLibs/.
      #     arm64-v8a is the one ~95% of modern Android phones want; users on
      #     it download ~half the bytes of the fat APK.
      #
      # We build --release (not --debug) so R8/minify/shrinkResources in
      # android/app/build.gradle actually fire. --debug builds skip the
      # release buildType entirely, so the v0.55 size work would be invisible.
      - name: Build fat (universal) APK — release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build per-ABI split APKs — release
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      # Fat APK = app-release.apk. Per-ABI APKs = app-arm64-v8a-release.apk,
      # app-armeabi-v7a-release.apk, app-x86_64-release.apk. Upload all 4.
      - name: Upload fat APK
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-fat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload per-ABI split APKs
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-split-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      # Legacy "all APKs" bucket — kept for backwards compat with any pinned
      # download links pointing at the old artifact name.
      - name: Upload all APKs (legacy bucket)
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-with-krita-engine
          path: build/app/outputs/flutter-apk/*.apk
